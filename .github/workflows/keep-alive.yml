name: Keep alive

# Render's free tier puts the service to sleep after ~15 minutes without traffic.
# This workflow pings the app every 10 minutes so it stays awake.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping the app
        run: |
          for i in 1 2 3; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 60 "https://finance-control-uhfl.onrender.com/health" || true)
            echo "Attempt $i: HTTP $code"
            [ "$code" = "200" ] && exit 0
            sleep 20
          done
          exit 1
